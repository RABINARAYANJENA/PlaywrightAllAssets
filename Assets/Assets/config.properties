# Execution Environment Selection (Options: QA, STG, PROD)
execution.environment=QA

# Core Infrastructure Paths
excel.testdata.directory=./TestData/

# Synchronization & Performance Timeouts (In Milliseconds)
timeout.implicit=5000
timeout.page.load=30000

# Framework Feature Toggles
playwright.tracing.enabled=true
video.recording.enabled=true
screenshot.on.action=true